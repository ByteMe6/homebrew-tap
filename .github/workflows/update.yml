name: Update formula

# Bumps Formula/trackfetch.rb when trackfetch, or one of the prebuilt binaries
# it bundles on macOS (ffmpeg, yt-dlp, deno), publishes a new release.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rewrite the formula
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_formula.py

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "::notice::formula is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update bundled binaries"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the tests explicitly.
          gh workflow run test.yml --ref main
