name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Audit
        run: brew audit --strict --online ./Formula/trackfetch.rb

  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install
        # The formula in this checkout, not the copy in the tap, so a PR is
        # tested before it lands. Nothing is compiled on macOS: ffmpeg, yt-dlp
        # and deno come from the prebuilt binaries the formula bundles.
        run: brew install --build-from-source ./Formula/trackfetch.rb
      - name: brew test
        run: brew test trackfetch
      - name: Run
        run: 'trackfetch --help | grep "usage: trackfetch"'
