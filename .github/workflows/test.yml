name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this checkout
        run: |
          taps="$(brew --repository)/Library/Taps/byteme"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
      - name: Audit
        run: brew audit --strict --online ByteMe6/tap/trackfetch

  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this checkout
        # Tests the formula from this checkout, so a pull request is tested
        # before it lands instead of the copy already in the tap.
        run: |
          taps="$(brew --repository)/Library/Taps/byteme"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
      - name: Install
        # Nothing is compiled on macOS: ffmpeg, yt-dlp and deno come from the
        # prebuilt binaries the formula bundles.
        run: brew install --build-from-source ByteMe6/tap/trackfetch
      - name: brew test
        run: brew test ByteMe6/tap/trackfetch
      - name: Run
        run: 'trackfetch --help | grep "usage: trackfetch"'
